services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_PATH: /app/data/commerce.db
    volumes: ["commerce-data:/app/data"]
  redis:
    image: redis:7.4-alpine
    profiles: [infra]
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: [infra]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes: ["etcd-data:/etcd"]
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: [infra]
    environment:
      MINIO_ROOT_USER: localdemo
      MINIO_ROOT_PASSWORD: local-demo-only-change-me
    command: ["minio", "server", "/minio_data"]
    volumes: ["minio-data:/minio_data"]
  milvus:
    image: milvusdb/milvus:v2.6.0
    profiles: [infra]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: localdemo
      MINIO_SECRET_ACCESS_KEY: local-demo-only-change-me
    depends_on: [etcd, minio]
    ports: ["127.0.0.1:19530:19530"]
    volumes: ["milvus-data:/var/lib/milvus"]
volumes:
  commerce-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
