# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# 仅创建一个免费计算服务，无付费磁盘或数据库。配置密钥后模型调用按提供商规则计费。
services:
  - type: web
    name: border-commerce-demo
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PUBLIC_DEMO
        value: "true"
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DEMO_TEMPORARY_DATA
        value: "true"
      - key: DATABASE_PATH
        value: /tmp/border-demo/commerce.db
      - key: MEMORY_BACKEND
        value: sqlite
      - key: KNOWLEDGE_BACKEND
        value: local
      - key: SUPPLIER_URL
        value: ""
      - key: LOGISTICS_URL
        value: ""
      - key: MCP_URL
        value: ""
      - key: LLM_BASE_URL
        value: https://ws-wx3zg6zl1sf52rk4.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      - key: LLM_MODEL
        value: deepseek-v4.1-flash-1017
